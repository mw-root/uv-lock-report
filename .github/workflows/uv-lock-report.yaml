name: uv Lockfile Report

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Report
        uses: mw-root/uv-lock-report@ba2c93e17693cf392b4cf6e85e48f437697abc73 # main
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
