---
site_name: uv Lock Report
site_url: https://mw-root.github.io/uv-lock-report/
repo_url: https://github.com/tophatmonocle/fastapi-boilerplate-service
edit_uri: ''
remote_branch: gh-pages
remote_name: origin
repo_name: mw-root/uv-lock-report
theme: 
  name: materialx
  color_mode: auto
  palette:
    - media: (prefers-color-scheme)
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: '(prefers-color-scheme: light)'
      scheme: default
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    - media: '(prefers-color-scheme: dark)'
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
plugins:
  - mike:
      alias_type: symlink
      canonical_version: latest
      version_selector: true
  # This builds the tree under the reference heading.
  # SUMMARY.md is generated by docs/gen_ref_pages.py
  - literate-nav:
      nav_file: SUMMARY.md
  # This generate reference pages from code and docstrings.
  - gen-files:
      scripts:
        - docs/gen_ref_pages.py
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: [src]
          options:
            filters:
              - '!^__'
            extensions:
              - griffe_pydantic:
                  schema: false
            docstring_section_style: list
            members_order: alphabetical
            show_root_heading: true
            show_source: true
            show_signature_annotations: true
            show_root_full_path: true
            show_root_members_full_path: false
            show_object_full_path: true
extra:
  version:
    provider: mike
    default: latest
    alias: true